[package]
name = "livetap-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "livetap"
path = "src/main.rs"

[dependencies]
livetap-core = { path = "../core" }
livetap-shared = { path = "../shared" }
iced = { version = "0.14", features = ["tokio"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["time"] }
